[package]
name = "qaspec"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Agentic E2E specs: declare goals and expectations, an LLM agent drives agent-browser and checks screen, console, network and state."
license = "MIT"
repository = "https://github.com/jaivial/qaspec"
homepage = "https://jaivial.github.io/qaspec/"
readme = "README.md"
keywords = ["e2e", "testing", "agent", "browser", "llm"]
categories = ["development-tools::testing", "command-line-utilities"]
exclude = ["docs/", "plan/", ".github/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
glob = "0.3"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
